name: Check the collection
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run check
      - run: npm run format:check
      - run: npm run test:exports
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Check production in the browser
        run: |
          npm run start > /tmp/elements-server.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:e2e
